name: Diagnose live site startup

on:
  push:
    branches: [fix/site-startup-20261108]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check DNS, GitHub Pages and alternate origin
        shell: bash
        run: |
          set +e
          echo '=== DNS current answer ==='
          getent ahostsv4 vaxt.pro
          getent ahostsv4 halsab.github.io
          echo '=== DNS NS and SOA ==='
          if command -v dig >/dev/null; then
            dig +noall +answer vaxt.pro NS
            dig +noall +answer vaxt.pro SOA
            dig +noall +answer vaxt.pro A
            dig @1.1.1.1 +noall +answer vaxt.pro A
            dig @8.8.8.8 +noall +answer vaxt.pro A
          else
            echo 'dig is unavailable'
          fi
          echo '=== Actual public site ==='
          curl -sSIL --connect-timeout 7 --max-time 13 --write-out 'PUBLIC HTTP=%{http_code} IP=%{remote_ip} URL=%{url_effective} TIME=%{time_total}\n' https://vaqt.pro/
          echo '=== GitHub Pages hostname without redirect ==='
          curl -sSI --connect-timeout 7 --max-time 13 --write-out 'GITHUB HTTP=%{http_code} IP=%{remote_ip} LOCATION=%{redirect_url} TIME=%{time_total}\n' https://halsab.github.io/vaqtpro/
          echo '=== Force route to GitHub Pages with original hostname/SNI ==='
          for ip in 185.199.108.153 185.199.109.153; do
            echo "GITHUB_PAGES_IP $ip"
            curl -sSIL --resolve "vaqt.pro:443:$ip" --connect-timeout 7 --max-time 13 --write-out 'FORCED HTTP=%{http_code} IP=%{remote_ip} URL=%{url_effective} TIME=%{time_total}\n' https://vaqt.pro/
          done
          echo '=== Completed ==='
