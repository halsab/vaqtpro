name: Diagnose live site startup

on:
  push:
    branches: [fix/site-startup-20261108]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public origin and document assets
        shell: bash
        run: |
          set -uo pipefail
          echo "=== DNS ==="
          getent ahostsv4 vaxt.pro || true
          getent ahostsv4 halsab.github.io || true
          echo "=== HTTPS responses ==="
          for url in https://vaqt.pro/ https://halsab.github.io/vaqtpro/; do
            echo "PROBING $url"
            curl --verbose --location --connect-timeout 8 --max-time 25 --output /tmp/vaqtpro-response --dump-header /tmp/vaqtpro-headers --write-out 'HTTP=%{http_code} EFFECTIVE=%{url_effective} DNS=%{time_namelookup} TLS=%{time_appconnect} TOTAL=%{time_total}\n' "$url" 2>&1 | tail -45
            echo "HEADERS"
            head -25 /tmp/vaqtpro-headers 2>/dev/null || true
            echo "HTML HEAD"
            head -c 900 /tmp/vaqtpro-response 2>/dev/null || true
            echo
          done
          echo "=== Public asset responses ==="
          curl -fLsS --connect-timeout 8 --max-time 25 -o /tmp/vaqtpro-index https://vaqt.pro/ || exit 1
          grep -oE '(src|href)="/assets/[^\"]+' /tmp/vaqtpro-index | head -10 || true
          for asset in $(grep -oE '/assets/[^" ]+\.(js|css)' /tmp/vaqtpro-index | head -4); do
            echo "ASSET $asset"
            curl -sSIL --connect-timeout 8 --max-time 15 --write-out 'HTTP=%{http_code} TYPE=%{content_type} TOTAL=%{time_total}\n' "https://vaqt.pro$asset" | tail -15
          done
