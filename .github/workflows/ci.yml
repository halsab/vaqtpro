name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_call:
    inputs:
      app_version:
        description: Версия для production-сборки
        required: true
        type: string
      full_quality_gate:
        description: Запустить полный набор проверок перед публикацией
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  verify:
    name: Проверки и production-сборка
    runs-on: ubuntu-latest
    # Keep browser binaries and OS dependencies pinned to the Playwright
    # version in package-lock.json. Avoid repeated apt installs on runners.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      VITE_APP_VERSION: ${{ inputs.app_version }}
      SEO_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Проверить ветку публикации
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo 'Публикацию можно запускать только из ветки main.'
          exit 1

      - name: Скачать репозиторий
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Разрешить Git работать с каталогом проекта в контейнере
        # actions/checkout uses a temporary HOME, so its safe.directory setting
        # is not necessarily available to later shell commands in the container.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" tag --list > /dev/null

      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Проверить выбранный номер сборки
        if: inputs.full_quality_gate
        run: node scripts/releaseVersion.ts

      - name: Установить зависимости
        run: npm ci

      - name: Определить область изменений
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            schedule)
              echo 'dependencies=true' >> "$GITHUB_OUTPUT"
              echo 'workflows=false' >> "$GITHUB_OUTPUT"
              ;;
            pull_request|push)
              if [ "${{ github.event_name }}" = 'pull_request' ]; then
                base='${{ github.event.pull_request.base.sha }}'
              else
                base='${{ github.event.before }}'
              fi
              if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                # Containerized checkouts may have no previous commit available.
                # Fail closed by executing every conditional check, not by
                # attempting HEAD~1 when the history is missing.
                if git rev-parse --verify 'HEAD^' >/dev/null 2>&1; then
                  base='HEAD^'
                else
                  echo 'dependencies=true' >> "$GITHUB_OUTPUT"
                  echo 'workflows=true' >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
              if [ "${{ github.event_name }}" = 'pull_request' ]; then
                base="$(git merge-base "$base" HEAD)"
              fi
              git diff --name-only "$base" HEAD > changed-files.txt
              node scripts/detectChanges.ts changed-files.txt >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'dependencies=false' >> "$GITHUB_OUTPUT"
              echo 'workflows=false' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Проверить закрепление GitHub Actions
        if: steps.changes.outputs.workflows == 'true'
        run: npm run actions:check

      - name: Проверить lint
        run: npm run lint

      - name: Отдельно проверить типы TypeScript
        if: github.event_name != 'schedule'
        run: npm run typecheck

      - name: Запустить модульные тесты
        if: github.event_name != 'schedule'
        run: npm test

      - name: Запустить модульные тесты и проверить покрытие
        if: github.event_name == 'schedule'
        run: npm run test:coverage

      - name: Собрать production-версию
        run: |
          echo "SEO_REFERENCE_INSTANT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          npm run build

      - name: Подготовить сравнительную production-сборку PR base
        if: github.event_name == 'pull_request'
        id: bundle-baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -uo pipefail
          if ! git diff --quiet "$BASE_SHA" HEAD -- package-lock.json .nvmrc; then
            echo '::notice::Bundle baseline skipped because the dependency lockfile or Node version changed.'
            exit 0
          fi

          baseline_root="$(mktemp -d "$RUNNER_TEMP/vaqtpro-pr-base-XXXXXX")"
          if ! git archive "$BASE_SHA" | tar -x -C "$baseline_root"; then
            echo '::notice::Bundle baseline unavailable because the PR base checkout could not be prepared.'
            exit 0
          fi
          if ! ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_root/node_modules"; then
            echo '::notice::Bundle baseline unavailable because shared dependencies could not be linked.'
            exit 0
          fi
          # Для baseline нужны только выпущенные ресурсы; typecheck блокирует текущую сборку выше.
          if ! (cd "$baseline_root" && ./node_modules/.bin/vite build); then
            echo '::notice::Bundle baseline unavailable because the PR base production build failed.'
            exit 0
          fi

          if ! echo "directory=$baseline_root/dist" >> "$GITHUB_OUTPUT"; then
            echo '::notice::Bundle baseline built, but its comparison path could not be recorded.'
          fi

      - name: Проверить production-артефакты и записать размеры
        env:
          BUILD_SIZE_BASELINE_DIR: ${{ steps.bundle-baseline.outputs.directory }}
        run: npm run build:check

      - name: Проверить npm audit
        if: steps.changes.outputs.dependencies == 'true'
        run: npm run security:audit

      - name: Проверить лицензии зависимостей
        if: steps.changes.outputs.dependencies == 'true'
        run: npm run license:check

      - name: Проверить запуск production-сайта
        if: github.event_name == 'push'
        run: npx playwright test tests/smoke.spec.ts --project=chromium

      - name: Проверить полный браузерный набор PR и релиза
        if: github.event_name == 'pull_request' || inputs.full_quality_gate
        run: npm run test:e2e

      - name: Загрузить артефакт GitHub Pages
        if: inputs.full_quality_gate
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
